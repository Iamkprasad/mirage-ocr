[project]
name = "mirage-ocr"
version = "0.1.0"
description = "Image and PDF OCR web app powered by Cactus Compute Mirage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ocr", "pdf", "text-recognition", "on-device", "mirage", "cactus-compute"]
dependencies = [
    "cactus-compute>=4.2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdfium2",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
